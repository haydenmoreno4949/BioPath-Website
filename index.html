<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>NJ Colleges & Biotech Map</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
		}

		#header {
			background-color: #fdfbe8;
			padding: 15px;
			text-align: center;
			border-bottom: 2px solid #eae6c9;
		}

		#header h1 {
			margin: 0;
			color: #113f28;
			font-size: 2rem;
		}

		#controls {
			text-align: center;
			padding: 10px;
			background-color: #ffffff;
		}

		.btn {
			padding: 8px 16px;
			margin: 0 5px;
			background-color: #113f28;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-weight: bold;
		}

		.btn:hover {
			background-color: #1b5e3a;
		}

		#map {
			width: 100%;
			height: calc(100vh - 120px);
		}

		.popup-box {
			text-align: center;
		}

		.info-btn {
			margin-top: 6px;
			padding: 4px 8px;
			background-color: #113f28;
			color: white;
			border: none;
			border-radius: 3px;
			cursor: pointer;
			font-size: 0.8rem;
		}
	</style>
</head>
<body>

<div id="header">
	<h1 id="title">New Jersey Interactive Map</h1>
</div>

<div id="controls">
	<button class="btn" onclick="showCategory('all')">Show All</button>
	<button class="btn" onclick="showCategory('colleges')">Colleges Only</button>
	<button class="btn" onclick="showCategory('companies')">Companies Only</button>
</div>

<div id="map"></div>

<script>
	// 1. Center map on New Jersey coordinates
	const map = L.map('map').setView([40.1500, -74.4057], 8);

	// 2. Esri Tile Layer
	const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
		maxZoom: 19,
		attribution: 'Tiles &copy; Esri'
	}).addTo(map);

	// 3. Define Custom Marker Icons
	const collegeIcon = new L.Icon({
		iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
		shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
		iconSize: [25, 41],
		iconAnchor: [12, 41],
		popupAnchor: [1, -34],
		shadowSize: [41, 41]
	});

	const companyIcon = new L.Icon({
		iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
		shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
		iconSize: [25, 41],
		iconAnchor: [12, 41],
		popupAnchor: [1, -34],
		shadowSize: [41, 41]
	});

	// 4. Layer Groups
	const collegeLayer = L.layerGroup().addTo(map);
	const companyLayer = L.layerGroup().addTo(map);

	// 5. College Data
	const colleges = [
		{ name: "Rutgers New Brunswick", city: "New Brunswick, NJ", coords: [40.5008, -74.4474], rate: "58%", cost: "$17,929/yr (In-state)" },
		{ name: "NJIT", city: "Newark, NJ", coords: [40.7424, -74.1784], rate: "67%", cost: "$22,426/yr (In-state)" },
		{ name: "Seton Hall", city: "South Orange, NJ", coords: [40.7931, -74.2476], rate: "69%", cost: "$55,040/yr" },
		{ name: "Montclair State", city: "Montclair, NJ", coords: [40.8621, -74.1978], rate: "89%", cost: "$55,040/yr" },
		{ name: "TCNJ", city: "Ewing, NJ", coords: [40.2683, -74.7808], rate: "61%", cost: "$20,986/yr (In-state)" },
		{ name: "Stevens Institute of Technology", city: "Hoboken, NJ", coords: [40.7448, -74.0256], rate: "51%", cost: "$68,230/yr" },
		{ name: "Princeton University", city: "Princeton, NJ", coords: [40.3487, -74.6593], rate: "4%", cost: "$68,140/yr" },
		{ name: "Rowan University", city: "Glassboro, NJ", coords: [39.7099, -75.1192], rate: "77%", cost: "$18,300/yr (In-state)" },
		{ name: "County College of Morris", city: "Randolph, NJ", coords: [40.8587, -74.5701], rate: "100%", cost: "$241/yr (In-state)" },
		{ name: "Stockton University", city: "Galloway, NJ", coords: [39.4932, -74.5317], rate: "90%", cost: "$14,400/yr (In-state)" }
	];

	colleges.forEach(col => {
		L.marker(col.coords, { icon: collegeIcon })
			.bindPopup(`
				<div class="popup-box">
					<b>${col.name}</b><br/>
					<small>${col.city}</small><br/>
					<button class="info-btn" onclick="alert('${col.name}\\nAcceptance Rate: ${col.rate}\\nCost: ${col.cost}')">See More Info</button>
				</div>
			`)
			.addTo(collegeLayer);
	});

	// 6. Company Data
	const companies = [
		{ name: "Johnson and Johnson", city: "New Brunswick, NJ", region: "Central Jersey", coords: [40.4965, -74.4431], desc: "Large biopharmaceutical company selling prescription drugs and medtech." },
		{ name: "Bristol Myers Squibb (BMS)", city: "Lawrenceville, NJ", region: "Central Jersey", coords: [40.3010, -74.7313], desc: "Discovers and delivers medicines for serious diseases." },
		{ name: "Novartis", city: "East Hanover, NJ", region: "North Jersey", coords: [40.8173, -74.3738], desc: "Researches, manufactures, and markets innovative prescription medicines." },
		{ name: "Bayer", city: "Whippany, NJ", region: "North Jersey", coords: [40.8243, -74.4168], desc: "Healthcare and agricultural biotechnology solutions." },
		{ name: "Enalare Therapeutics", city: "Mullica Hill, NJ", region: "South Jersey", coords: [39.7387, -75.2241], desc: "Therapeutics for life-threatening respiratory conditions." }
	];

	companies.forEach(comp => {
		L.marker(comp.coords, { icon: companyIcon })
			.bindPopup(`
				<div class="popup-box">
					<b>${comp.name}</b><br/>
					<small>${comp.region} - ${comp.city}</small><br/>
					<button class="info-btn" onclick="alert('${comp.name}\\nRegion: ${comp.region}\\nDescription: ${comp.desc}')">See More Info</button>
				</div>
			`)
			.addTo(companyLayer);
	});

	// 7. Toggle Category View
	function showCategory(category) {
		const titleElem = document.getElementById('title');
		if (category === 'all') {
			map.addLayer(collegeLayer);
			map.addLayer(companyLayer);
			titleElem.innerText = "New Jersey Interactive Map";
		} else if (category === 'colleges') {
			map.addLayer(collegeLayer);
			map.removeLayer(companyLayer);
			titleElem.innerText = "NJ Colleges Map";
		} else if (category === 'companies') {
			map.addLayer(companyLayer);
			map.removeLayer(collegeLayer);
			titleElem.innerText = "NJ Biotech Companies Map";
		}
	}
</script>

</body>
</html>
